<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing — 4px grid" subtitle="The rhythm everything snaps to" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px 24px;background:var(--surface-base);color:var(--text-body);display:flex;align-items:flex-end;gap:16px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:linear-gradient(180deg,var(--gold-400),var(--gold-600));border-radius:3px;width:26px}
  .t{font-size:10px;font-family:var(--font-mono);color:var(--text-subtle)}
  .px{font-size:11px;color:var(--text-muted);font-weight:600}
</style></head>
<body>
  <div class="col"><span class="px">4</span><span class="bar" style="height:4px"></span><span class="t">space-1</span></div>
  <div class="col"><span class="px">8</span><span class="bar" style="height:8px"></span><span class="t">space-2</span></div>
  <div class="col"><span class="px">12</span><span class="bar" style="height:12px"></span><span class="t">space-3</span></div>
  <div class="col"><span class="px">16</span><span class="bar" style="height:16px"></span><span class="t">space-4</span></div>
  <div class="col"><span class="px">24</span><span class="bar" style="height:24px"></span><span class="t">space-6</span></div>
  <div class="col"><span class="px">32</span><span class="bar" style="height:32px"></span><span class="t">space-8</span></div>
  <div class="col"><span class="px">48</span><span class="bar" style="height:48px"></span><span class="t">space-12</span></div>
  <div class="col"><span class="px">64</span><span class="bar" style="height:64px"></span><span class="t">space-16</span></div>
</body></html>
