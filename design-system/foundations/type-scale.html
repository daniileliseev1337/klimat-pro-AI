<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="Geist — page titles down to micro eyebrow labels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px 24px;background:var(--surface-base);color:var(--text-body)}
  .row{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--border-subtle)}
  .row:last-child{border-bottom:none}
  .meta{width:96px;flex-shrink:0;font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}
  .spec{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-disabled)}
</style></head>
<body>
  <div class="row"><span class="meta">xl · 26</span><span style="font-size:26px;font-weight:600;letter-spacing:-.022em;color:var(--text-strong)">Финансовый центр</span><span class="spec">600 · -.022em</span></div>
  <div class="row"><span class="meta">lg · 20</span><span style="font-size:20px;font-weight:600;letter-spacing:-.014em;color:var(--text-strong)">Активные проекты</span><span class="spec">600 · -.014em</span></div>
  <div class="row"><span class="meta">md · 16</span><span style="font-size:16px;font-weight:500">Корпус B · ОВиК и вентиляция</span><span class="spec">500</span></div>
  <div class="row"><span class="meta">base · 14</span><span style="font-size:14px;color:var(--text-body)">Тело интерфейса — основной размер для всех экранов.</span><span class="spec">400</span></div>
  <div class="row"><span class="meta">small · 12</span><span style="font-size:12px;color:var(--text-muted)">Плотные таблицы, чипы, вторичные подписи</span><span class="spec">400</span></div>
  <div class="row"><span class="meta">micro · 10</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:.10em;font-weight:600;color:var(--text-subtle)">EYEBROW · МЕТКА РАЗДЕЛА</span><span class="spec">600 · .10em</span></div>
</body></html>
