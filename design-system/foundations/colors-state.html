<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & State" subtitle="Muted signals — inform without shouting over the noir" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px 24px;background:var(--surface-base);display:flex;gap:12px}
  .cell{flex:1;border-radius:var(--radius-md);padding:12px 14px;border:1px solid}
  .n{font-size:12px;font-weight:600;margin-bottom:6px}
  .v{font-size:10px;font-family:var(--font-mono);opacity:.7}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style></head>
<body>
  <div class="cell" style="background:var(--success-fill);border-color:var(--success-border)"><div class="n" style="color:var(--success)"><span class="dot" style="background:var(--success)"></span>Success</div><div class="v" style="color:var(--success)">#6ee7a8 · Оплачен</div></div>
  <div class="cell" style="background:var(--warning-fill);border-color:var(--warning-border)"><div class="n" style="color:var(--warning)"><span class="dot" style="background:var(--warning)"></span>Warning</div><div class="v" style="color:var(--warning)">#f3d77b · Дедлайн</div></div>
  <div class="cell" style="background:var(--danger-fill);border-color:var(--danger-border)"><div class="n" style="color:var(--danger)"><span class="dot" style="background:var(--danger)"></span>Danger</div><div class="v" style="color:var(--danger)">#f8a3a3 · Просрочен</div></div>
  <div class="cell" style="background:var(--info-fill);border-color:var(--info-border)"><div class="n" style="color:var(--info)"><span class="dot" style="background:var(--info)"></span>Info</div><div class="v" style="color:var(--info)">#93c5fd · Новый</div></div>
</body></html>
