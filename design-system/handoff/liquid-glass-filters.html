<!-- КЛИМАТ-ПРО · SVG-фильтры жидкого стекла.
     Вставь этот блок ОДИН РАЗ в index.html сразу после <body> (или инжектни из
     main.jsx — см. APPLY.md). #lg-warp гнёт фон по телу карточки. Без него
     .kp-card / .glass-card мягко деградируют в тёмное матовое стекло. -->
<svg width="0" height="0" style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="lg-warp" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.010" numOctaves="2" seed="12" result="t"></feTurbulence>
      <feGaussianBlur in="t" stdDeviation="1.3" result="s"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="s" scale="42" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <filter id="lg-rim" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.012" numOctaves="2" seed="7" result="t"></feTurbulence>
      <feGaussianBlur in="t" stdDeviation="1.1" result="s"></feGaussianBlur>
      <feDisplacementMap in="SourceGraphic" in2="s" scale="96" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </defs>
</svg>
