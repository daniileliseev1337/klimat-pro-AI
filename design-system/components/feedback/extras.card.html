<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .cap { font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: var(--ls-eyebrow); color: var(--text-subtle); font-weight: 600; margin: 0 0 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DropdownMenu, Tooltip, Checkbox, Skeleton, EmptyState, Card, IconButton, Button } = window.KlimatProDesignSystem_a56ef7;
const Dots = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>;
const Edit = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
const Trash = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>;
const Inbox = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>;

function Demo() {
  const [a, setA] = React.useState(true), [b, setB] = React.useState(false);
  return (
    <div className="grid">
      <Card padding={18} hover={false}>
        <p className="cap">Menu · Tooltip</p>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <DropdownMenu align="left" trigger={<IconButton><Dots/></IconButton>} items={[
            { label:"Редактировать", icon:<Edit/>, hint:"E" },
            { label:"Дублировать", icon:<Edit/> },
            { divider:true },
            { label:"Удалить", icon:<Trash/>, danger:true },
          ]} />
          <Tooltip content="Архивировать проект">
            <Button variant="ghost" size="sm">Наведи</Button>
          </Tooltip>
        </div>
      </Card>

      <Card padding={18} hover={false}>
        <p className="cap">Checkbox</p>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Checkbox checked={a} onChange={setA} label="Учитывать НДС" />
          <Checkbox checked={b} onChange={setB} label="Повторять ежемесячно" />
          <Checkbox checked={false} disabled label="Архивный (недоступно)" />
        </div>
      </Card>

      <Card padding={18} hover={false}>
        <p className="cap">Skeleton</p>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <Skeleton w={40} h={40} radius="50%" />
          <div style={{flex:1}}><Skeleton lines={3} /></div>
        </div>
      </Card>

      <Card padding={6} hover={false} style={{gridColumn:"1 / -1"}}>
        <EmptyState icon={<Inbox/>} title="Пока нет операций" description="Как только появится первый платёж по проекту, он отобразится здесь." action={<Button size="sm">Выставить счёт</Button>} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
