<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>КЛИМАТ Pro — карточки 21–35 (интерактив)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" />
<style>
  :root{--gold:#d4af37;--gold-bright:#e8c860;--gold-soft:#c9a431;--gold-glow:rgba(212,175,55,.4);
    --border-subtle:rgba(255,255,255,.06);--border-gold:rgba(212,175,55,.3);
    --text-primary:#fafaf7;--text-secondary:#a8a8a3;--text-tertiary:#6b6b67;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;color:var(--text-primary);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1100px 700px at 82% -8%,rgba(212,175,55,.14),transparent 60%),radial-gradient(820px 600px at 3% 108%,rgba(212,175,55,.08),transparent 60%),#0a0a0a;}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 26px 72px;}
  .head{display:flex;align-items:center;gap:11px;}
  .badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 20%,rgba(232,200,96,.18),rgba(212,175,55,.04));border:1px solid rgba(212,175,55,.4);}
  .wm{font-size:16px;font-weight:700;letter-spacing:.02em;background:linear-gradient(100deg,#a9821f,#d4af37 45%,#ead27a 58%,#c9a431 78%,#a9821f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .wm b{font-weight:400;color:var(--text-secondary);-webkit-text-fill-color:var(--text-secondary);}
  h1{font-size:22px;font-weight:600;letter-spacing:-.022em;margin:24px 0 4px;}
  .lede{font-size:13.5px;color:var(--text-secondary);max-width:730px;line-height:1.55;margin:0 0 24px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:940px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  .dir{display:flex;flex-direction:column;gap:10px;}
  .num{font-family:'Geist Mono',monospace;font-size:11px;color:var(--gold);border:1px solid var(--border-gold);border-radius:999px;padding:2px 9px;align-self:flex-start;}
  .dname{font-size:13px;font-weight:600;}
  .dname em{color:var(--gold-soft);font-style:normal;font-weight:500;font-size:11px;} 
  .ddesc{font-size:11.5px;color:var(--text-tertiary);line-height:1.45;}

  .card{position:relative;border-radius:16px;padding:20px;min-height:156px;overflow:hidden;cursor:pointer;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s;box-shadow:0 14px 34px rgba(0,0,0,.5);}
  .klabel{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.09em;position:relative;z-index:4;}
  .knum{font-size:25px;font-weight:700;color:#f7f8f8;margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:4;}
  .ksub{font-size:11.5px;color:var(--text-tertiary);margin-top:8px;position:relative;z-index:4;}
  .mono{font-family:'Geist Mono',monospace;}
  .khead{display:flex;justify-content:space-between;align-items:flex-start;}
  .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#d4af371a;border:1px solid #d4af3733;position:relative;z-index:4;transition:transform .12s ease;}
  .base{background:linear-gradient(150deg,#151413,#0d0d0c);border:1px solid rgba(212,175,55,.2);}

  /* 21 Наклон-3D */
  .c-tilt{transform-style:preserve-3d;transition:transform .1s ease-out,box-shadow .2s;}
  .c-tilt .layer{transform:translateZ(38px);}
  .c-tilt .sheen{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(255,246,213,.18),transparent 55%);}
  .c-tilt:hover .sheen{opacity:1;}

  /* 22 Флип */
  .c-flip{background:transparent;border:none;box-shadow:none;perspective:900px;padding:0;}
  .flip-in{position:relative;width:100%;height:100%;min-height:156px;transition:transform .6s cubic-bezier(.5,0,.2,1.2);transform-style:preserve-3d;}
  .c-flip.on .flip-in{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:16px;padding:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:opacity 0s linear .3s;}
  .front{background:linear-gradient(150deg,#151413,#0d0d0c);border:1px solid rgba(212,175,55,.22);opacity:1;}
  .c-flip.on .front{opacity:0;}
  .back{background:linear-gradient(150deg,#1a160c,#100d07);border:1px solid rgba(212,175,55,.5);transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:8px;opacity:0;}
  .c-flip.on .back{opacity:1;}

  /* 24 Спот-свет */
  .c-spot .sp{position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(212,175,55,.2),transparent 58%);}
  .c-spot:hover .sp{opacity:1;}

  /* 25 Магнит-иконка (обрабатывается в JS) */

  /* 26 Спарклайн растёт */
  .c-spark .sparkwrap{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:1;clip-path:inset(56px 0 0 0);transition:clip-path .6s cubic-bezier(.3,1,.4,1);}
  .c-spark:hover .sparkwrap{clip-path:inset(0 0 0 0);}

  /* 27 Риппл на клик */
  .rip{position:absolute;border-radius:50%;background:rgba(232,200,96,.4);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:2;}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0;width:420px;height:420px;}}

  /* 28 Шиммер */
  .c-shim .shim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,246,213,.28) 48%,transparent 56%);background-size:250% 100%;background-position:150% 0;transition:none;}
  .c-shim:hover .shim{animation:shimm .9s ease;}
  @keyframes shimm{from{background-position:150% 0}to{background-position:-90% 0}}

  /* 30 Раскрытие строк */
  .c-exp .more{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s ease,margin-top .4s;position:relative;z-index:4;}
  .c-exp:hover .more{max-height:80px;opacity:1;margin-top:12px;}
  .exprow{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06);}

  /* 32 Градиент за курсором */
  .c-grad{background:linear-gradient(150deg,#151413,#0d0d0c);border:1px solid rgba(212,175,55,.2);}
  .c-grad .g{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,20%) var(--my,20%),rgba(212,175,55,.22),transparent 60%);transition:background .1s;}

  /* 35 Кольцо-прогресс рисуется */
  .prog{transform:rotate(-90deg);}
  .prog circle{transition:stroke-dashoffset 1.1s cubic-bezier(.3,1,.4,1);}

  .hint{position:absolute;top:11px;right:12px;font-size:9px;font-family:'Geist Mono',monospace;color:var(--gold-soft);background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);border-radius:6px;padding:2px 6px;z-index:5;opacity:.85;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="badge"><svg width="22" height="22" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#c9a431"/><stop offset=".46" stop-color="#fff6d5"/><stop offset=".56" stop-color="#e8c860"/><stop offset="1" stop-color="#a9821f"/></linearGradient></defs><g stroke="url(#g)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M13 17h13a3.4 3.4 0 1 0-3.4-3.4"/><path d="M13 24h19a3.4 3.4 0 1 1-3.4 3.4"/><path d="M13 31h10a3.4 3.4 0 1 0-3.4 3.4"/></g></svg></div>
    <div class="wm">КЛИМАТ<b> Pro</b></div>
  </div>
  <h1>Карточки 21–35 — с интерактивом</h1>
  <p class="lede">Каждая реагирует на курсор/клик. Наводи и кликай: наклон в 3D, переворот, счётчики, магнитные иконки, спот-свет, риппл, раскрытие деталей. Подпись <em>курсивом</em> под каждой — что делает.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  var IC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';
  function icon(){return '<div class="ic">'+IC+'</div>';}
  function kpi(cls){return '<div class="'+(cls||'')+'"><div class="khead"><div><div class="klabel">Портфель</div><div class="knum" data-count="8400000" data-suffix=" ₽">8 400 000 ₽</div><div class="ksub">моё: 5 200 000 ₽</div></div>'+icon()+'</div></div>';}
  function spark(id){return '<svg width="100%" height="56" viewBox="0 0 300 56" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(212,175,55,.4)"/><stop offset="1" stop-color="rgba(212,175,55,0)"/></linearGradient></defs><polygon points="0,50 0,38 40,42 80,26 120,32 160,16 200,24 240,10 300,16 300,56" fill="url(#'+id+')"/><polyline points="0,38 40,42 80,26 120,32 160,16 200,24 240,10 300,16" fill="none" stroke="#e8c860" stroke-width="2"/></svg>';}
  function ring(pct){var r=32,c=2*Math.PI*r,off=c*(1-pct/100);return '<svg class="prog" width="78" height="78" data-ring="'+off+'"><circle cx="39" cy="39" r="32" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle cx="39" cy="39" r="32" fill="none" stroke="#e8c860" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'"/></svg>';}

  var V=[
    {n:'21 · Наклон-3D',t:'следит за курсором, наклон в объёме',cls:'c-tilt base',html:'<div class="sheen"></div><div class="layer">'+kpi()+'</div>',fx:'tilt'},
    {n:'22 · Флип',t:'клик — переворот на детали',cls:'c-flip',html:'<div class="flip-in"><div class="face front"><span class="hint">клик</span>'+kpi()+'</div><div class="face back"><div class="klabel">Разбивка портфеля</div><div style="display:flex;justify-content:space-between;font-size:13px;color:#f0e4c4"><span>Отопление</span><b>3.2 млн</b></div><div style="display:flex;justify-content:space-between;font-size:13px;color:#f0e4c4"><span>Вентиляция</span><b>2.1 млн</b></div><div style="display:flex;justify-content:space-between;font-size:13px;color:#f0e4c4"><span>Кондиц.</span><b>3.1 млн</b></div></div></div>',fx:'flip'},
    {n:'23 · Счётчик',t:'цифра набегает при появлении',cls:'base',html:kpi(),fx:'count'},
    {n:'24 · Спот-свет',t:'золотое пятно за курсором',cls:'c-spot base',html:'<div class="sp"></div>'+kpi(),fx:'track'},
    {n:'25 · Магнит',t:'иконка тянется к курсору',cls:'base',html:kpi(),fx:'magnet'},
    {n:'26 · Спарклайн',t:'график вырастает на hover',cls:'c-spark base',html:kpi()+'<div class="sparkwrap">'+spark('s26')+'</div>',fx:''},
    {n:'27 · Риппл',t:'волна из точки клика',cls:'base',html:kpi(),fx:'ripple'},
    {n:'28 · Шиммер',t:'блик пробегает на hover',cls:'c-shim base',html:'<div class="shim"></div>'+kpi(),fx:''},
    {n:'29 · Гейдж-фокус',t:'кольцо заполняется при показе',cls:'base',html:'<div style="display:flex;align-items:center;gap:16px">'+ring(62)+'<div><div class="klabel">Собрано</div><div class="knum" style="font-size:20px;margin-top:6px">5.2 / 8.4 млн</div></div></div>',fx:'ring'},
    {n:'30 · Раскрытие',t:'детали выезжают на hover',cls:'c-exp base',html:kpi()+'<div class="more"><div class="exprow"><span>Приход за месяц</span><b style="color:#6ee7a8">+420 000</b></div><div class="exprow"><span>Расход</span><b style="color:#f8a3a3">−397 500</b></div></div>',fx:''},
    {n:'31 · Нажатие',t:'проминается при клике',cls:'base',html:'<span class="hint">жми</span>'+kpi(),fx:'press'},
    {n:'32 · Градиент-курсор',t:'подсветка едет за мышью',cls:'c-grad',html:'<div class="g"></div>'+kpi(),fx:'track'},
    {n:'33 · Скраб цифры',t:'значение «крутится» на hover',cls:'base',html:kpi(),fx:'scrub'},
    {n:'34 · Искры',t:'клик рассыпает золотые искры',cls:'base',html:'<span class="hint">клик</span>'+kpi(),fx:'sparks'},
    {n:'35 · Кольцо+счёт',t:'рисуется и считает при показе',cls:'base',html:'<div style="display:flex;align-items:center;gap:16px">'+ring(74)+'<div><div class="klabel">Готовность</div><div class="knum" style="font-size:22px;margin-top:6px" data-count="74" data-suffix="%">74%</div></div></div>',fx:'ringcount'}
  ];
  document.getElementById('grid').innerHTML=V.map(function(v,i){
    return '<div class="dir"><span class="num">'+('0'+(i+21)).slice(-2)+'</span><div class="card '+v.cls+'" data-fx="'+v.fx+'">'+v.html+'</div><div><div class="dname">'+v.n+'</div><div class="ddesc"><em>'+v.t+'</em></div></div></div>';
  }).join('');

  // ── интерактив-движок ──
  function track(el,e){var r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');}
  function countUp(node){var tgt=+node.dataset.count,suf=node.dataset.suffix||'',t0=null,dur=1100;
    function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3),val=Math.round(tgt*e);
      node.textContent=val.toLocaleString('ru-RU')+suf;if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
  function drawRing(card){var c=card.querySelector('circle:last-child');if(c)c.style.strokeDashoffset=card.querySelector('.prog').dataset.ring;}

  document.querySelectorAll('.card').forEach(function(card){
    var fx=card.dataset.fx;
    if(fx==='tilt'){card.addEventListener('mousemove',function(e){track(card,e);var r=card.getBoundingClientRect();var rx=((e.clientY-r.top)/r.height-.5)*-12,ry=((e.clientX-r.left)/r.width-.5)*14;card.style.transform='perspective(800px) rotateX('+rx+'deg) rotateY('+ry+'deg) translateY(-4px)';});card.addEventListener('mouseleave',function(){card.style.transform='';});}
    if(fx==='track'){card.addEventListener('mousemove',function(e){track(card,e);});}
    if(fx==='flip'){card.addEventListener('click',function(){card.classList.toggle('on');});}
    if(fx==='magnet'){var ic=card.querySelector('.ic');card.addEventListener('mousemove',function(e){var r=card.getBoundingClientRect(),ir=ic.getBoundingClientRect();var dx=(e.clientX-(ir.left+ir.width/2))*.35,dy=(e.clientY-(ir.top+ir.height/2))*.35;ic.style.transform='translate('+dx+'px,'+dy+'px)';});card.addEventListener('mouseleave',function(){ic.style.transform='';});}
    if(fx==='press'){card.addEventListener('pointerdown',function(){card.style.transform='scale(.965)';});['pointerup','pointerleave'].forEach(function(ev){card.addEventListener(ev,function(){card.style.transform='';});});}
    if(fx==='scrub'){var nn=card.querySelector('.knum');card.addEventListener('mouseenter',function(){var i=0,iv=setInterval(function(){nn.textContent=(7000000+Math.floor(Math.random()*2000000)).toLocaleString('ru-RU')+' ₽';if(++i>8){clearInterval(iv);nn.textContent='8 400 000 ₽';}},55);});}
    if(fx==='ripple'||fx==='sparks'){card.addEventListener('click',function(e){var r=card.getBoundingClientRect();
      if(fx==='ripple'){var d=document.createElement('span');d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';card.appendChild(d);setTimeout(function(){d.remove();},600);}
      else{for(var k=0;k<14;k++){(function(){var s=document.createElement('span');var ang=Math.random()*6.28,dist=40+Math.random()*70;s.style.cssText='position:absolute;z-index:3;width:4px;height:4px;border-radius:50%;background:#ffe9a8;pointer-events:none;left:'+(e.clientX-r.left)+'px;top:'+(e.clientY-r.top)+'px;transition:transform .6s ease-out,opacity .6s;';card.appendChild(s);requestAnimationFrame(function(){s.style.transform='translate('+Math.cos(ang)*dist+'px,'+Math.sin(ang)*dist+'px)';s.style.opacity='0';});setTimeout(function(){s.remove();},650);})();}}
    });}
  });

  // появление: count-up + ring draw
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var c=en.target;
    c.querySelectorAll('[data-count]').forEach(countUp);if(c.querySelector('.prog'))drawRing(c);io.unobserve(c);}});},{threshold:.4});
  document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
  var _s=document.createElement('script');_s.src='select.js';document.body.appendChild(_s);
</script>
</body>
</html>
