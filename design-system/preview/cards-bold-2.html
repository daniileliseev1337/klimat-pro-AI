<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>КЛИМАТ Pro — карточки: ещё смелее</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap" />
<style>
  :root{--gold:#d4af37;--gold-bright:#e8c860;--gold-soft:#c9a431;--gold-glow:rgba(212,175,55,.4);
    --border-subtle:rgba(255,255,255,.06);--border-gold:rgba(212,175,55,.3);
    --text-primary:#fafaf7;--text-secondary:#a8a8a3;--text-tertiary:#6b6b67;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;color:var(--text-primary);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1100px 700px at 82% -8%,rgba(212,175,55,.14),transparent 60%),radial-gradient(820px 600px at 3% 108%,rgba(212,175,55,.08),transparent 60%),#0a0a0a;}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 26px 72px;}
  .head{display:flex;align-items:center;gap:11px;}
  .badge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(120% 120% at 30% 20%,rgba(232,200,96,.18),rgba(212,175,55,.04));border:1px solid rgba(212,175,55,.4);}
  .wm{font-size:16px;font-weight:700;letter-spacing:.02em;background:linear-gradient(100deg,#a9821f,#d4af37 45%,#ead27a 58%,#c9a431 78%,#a9821f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .wm b{font-weight:400;color:var(--text-secondary);-webkit-text-fill-color:var(--text-secondary);}
  h1{font-size:22px;font-weight:600;letter-spacing:-.022em;margin:24px 0 4px;}
  .lede{font-size:13.5px;color:var(--text-secondary);max-width:730px;line-height:1.55;margin:0 0 24px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media (max-width:940px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  .dir{display:flex;flex-direction:column;gap:10px;}
  .num{font-family:'Geist Mono',monospace;font-size:11px;color:var(--gold);border:1px solid var(--border-gold);border-radius:999px;padding:2px 9px;align-self:flex-start;}
  .dname{font-size:13px;font-weight:600;}
  .ddesc{font-size:11.5px;color:var(--text-tertiary);line-height:1.45;}

  .card{position:relative;border-radius:16px;padding:20px;min-height:156px;overflow:hidden;transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s,border-color .18s;box-shadow:0 14px 34px rgba(0,0,0,.5);}
  .card:hover{transform:translateY(-4px);}
  .klabel{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.09em;position:relative;z-index:4;}
  .knum{font-size:25px;font-weight:700;color:#f7f8f8;margin-top:9px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative;z-index:4;}
  .ksub{font-size:11.5px;color:var(--text-tertiary);margin-top:8px;position:relative;z-index:4;}
  .bgsvg{position:absolute;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;}

  /* 11 СОТЫ — решётка вентиляции (гекс-сетка) */
  .c-honey{background:linear-gradient(150deg,#151413,#0d0d0c);border:1px solid rgba(212,175,55,.28);}

  /* 12 ПЕРФОРАЦИЯ — перфорированная панель (вент-отверстия) */
  .c-perf{background:radial-gradient(circle,rgba(212,175,55,.16) 1.1px,transparent 1.7px) 0 0/13px 13px,linear-gradient(150deg,#161514,#0e0d0c);border:1px solid rgba(212,175,55,.24);box-shadow:inset 0 1px 0 rgba(255,246,213,.08),0 14px 34px rgba(0,0,0,.5);}

  /* 13 ЖАЛЮЗИ — вент-ламели */
  .c-louvre{background:repeating-linear-gradient(0deg,#1a1815 0 7px,#100f0c 7px 9px),repeating-linear-gradient(0deg,rgba(255,246,213,.05) 0 1px,transparent 1px 9px);border:1px solid rgba(212,175,55,.24);}
  .c-louvre::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 45%);}

  /* 14 ТЕРМОКАРТА — тепловизор климата */
  .c-thermo{background:radial-gradient(130% 120% at 100% 0%,rgba(240,150,40,.4),rgba(212,175,55,.14) 32%,transparent 58%),linear-gradient(150deg,#141210,#0c0b0a);border:1px solid rgba(212,175,55,.22);}

  /* 15 МРАМОР — чёрный мрамор с золотыми прожилками */
  .c-marble{background:linear-gradient(150deg,#111010,#0a0a09);border:1px solid rgba(212,175,55,.3);}

  /* 16 НЕОН — светящийся золотой контур, дышит */
  .c-neon{background:#0c0c0b;border:1.5px solid rgba(232,200,96,.85);animation:neon 3.2s ease-in-out infinite;}
  @keyframes neon{0%,100%{box-shadow:0 0 12px rgba(212,175,55,.4),inset 0 0 12px rgba(212,175,55,.1),0 14px 34px rgba(0,0,0,.5);}50%{box-shadow:0 0 24px rgba(232,200,96,.75),inset 0 0 20px rgba(212,175,55,.2),0 14px 34px rgba(0,0,0,.5);}}

  /* 17 ДИАГОНАЛЬ — жирный золотой слэш */
  .c-slash{background:linear-gradient(150deg,#161514,#0d0d0c);border:1px solid var(--border-subtle);}
  .c-slash .slash{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(114deg,transparent 38%,rgba(212,175,55,.9) 38.5% 41%,transparent 41.5% 44%,rgba(255,246,213,.95) 44.5% 46.5%,transparent 47% 100%);}

  /* 18 ТИСНЕНИЕ — вдавленный знак airflow */
  .c-emboss{background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),linear-gradient(150deg,#181613,#100e0b);border:1px solid rgba(212,175,55,.2);}
  .c-emboss .emb{position:absolute;right:-4px;bottom:-8px;z-index:0;opacity:.9;}

  /* 19 ГОЛОГРАФИЯ — иридесцентный золотой перелив */
  .c-holo{background:#0b0b0a;border:1px solid rgba(212,175,55,.3);}
  .c-holo::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.25;
    background:conic-gradient(from 0deg at 35% 25%,#d4af37,#fff6d5,#b8901f,#ead27a,#e8c860,#d4af37);animation:holo 7s linear infinite;}
  @keyframes holo{to{filter:hue-rotate(300deg);}}

  /* 20 ФРЕЗЕРОВКА — фрезерованный металл, 3D-фаска */
  .c-mill{background:linear-gradient(150deg,#1a1813,#100f0c);border:none;
    box-shadow:inset 2px 2px 3px rgba(255,246,213,.14),inset -2px -2px 4px rgba(0,0,0,.7),0 14px 34px rgba(0,0,0,.5);}
  .c-mill::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;pointer-events:none;z-index:3;background:linear-gradient(135deg,#fff6d5,#a9821f 40%,#0000 41% 59%,#a9821f 60%,#fff6d5);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="badge"><svg width="22" height="22" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#c9a431"/><stop offset=".46" stop-color="#fff6d5"/><stop offset=".56" stop-color="#e8c860"/><stop offset="1" stop-color="#a9821f"/></linearGradient></defs><g stroke="url(#g)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M13 17h13a3.4 3.4 0 1 0-3.4-3.4"/><path d="M13 24h19a3.4 3.4 0 1 1-3.4 3.4"/><path d="M13 31h10a3.4 3.4 0 1 0-3.4 3.4"/></g></svg></div>
    <div class="wm">КЛИМАТ<b> Pro</b></div>
  </div>
  <h1>Карточки — ещё смелее (11–20)</h1>
  <p class="lede">Вторая волна с климат-ДНК: решётка вентиляции, перфорация, жалюзи, термокарта — плюс мрамор, неон, голография и фрезерованный металл. Те же данные для честного сравнения.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
  var IC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:relative;z-index:4"><path d="M4 7h16v13H4zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';
  function kpi(){return '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="klabel">Портфель</div><div class="knum">8 400 000 ₽</div><div class="ksub">моё: 5 200 000 ₽</div></div><div style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#d4af371a;border:1px solid #d4af3733;position:relative;z-index:4">'+IC+'</div></div>';}
  var HEX='<svg class="bgsvg"><defs><pattern id="hx" width="30" height="26" patternUnits="userSpaceOnUse"><path d="M15 1 L28 8.5 L28 21 L15 28 L2 21 L2 8.5 Z" fill="none" stroke="rgba(212,175,55,.15)" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#hx)"/></svg>';
  var MARBLE='<svg class="bgsvg" viewBox="0 0 300 160" preserveAspectRatio="none"><path d="M-10,44 C60,18 120,86 185,52 S280,26 320,64" fill="none" stroke="rgba(212,175,55,.45)" stroke-width="1.3"/><path d="M-10,108 C70,92 132,142 210,108 S300,120 330,98" fill="none" stroke="rgba(212,175,55,.28)" stroke-width="1"/><path d="M40,-10 C60,50 30,90 70,150" fill="none" stroke="rgba(255,246,213,.18)" stroke-width="0.8"/></svg>';
  var EMB='<svg class="emb" width="150" height="150" viewBox="0 0 48 48" fill="none"><g stroke="#0b0a08" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" style="filter:drop-shadow(0 1px 0 rgba(255,246,213,.13)) drop-shadow(0 -1px 0 rgba(0,0,0,.75))"><path d="M9 17h13a3.4 3.4 0 1 0-3.4-3.4"/><path d="M9 24h19a3.4 3.4 0 1 1-3.4 3.4"/><path d="M9 31h10a3.4 3.4 0 1 0-3.4 3.4"/></g></svg>';

  var V=[
    {c:'c-honey',n:'Соты',d:'Гекс-решётка вентиляции фоном. Прямая климат-ДНК, техно и «инженерно».',x:HEX,b:kpi()},
    {c:'c-perf',n:'Перфорация',d:'Перфорированная металл-панель (вент-отверстия). Тактильно, на бренд.',x:'',b:kpi()},
    {c:'c-louvre',n:'Жалюзи',d:'Горизонтальные вент-ламели с бликом. Мотив решётки-жалюзи.',x:'',b:kpi()},
    {c:'c-thermo',n:'Термокарта',d:'Тёплый градиент тепловизора в углу. Климат буквально «виден».',x:'',b:kpi()},
    {c:'c-marble',n:'Мрамор',d:'Чёрный мрамор с золотыми прожилками. Максимальная роскошь.',x:MARBLE,b:kpi()},
    {c:'c-neon',n:'Неон',d:'Светящийся золотой контур, мягко «дышит». Дорого-кибер.',x:'',b:kpi()},
    {c:'c-slash',n:'Диагональ',d:'Жирный золотой слэш через карточку. Смелая графика, характер.',x:'<div class="slash"></div>',b:kpi()},
    {c:'c-emboss',n:'Тиснение',d:'Вдавленный в металл знак airflow (рельеф). Фирменно и тактильно.',x:EMB,b:kpi()},
    {c:'c-holo',n:'Голография',d:'Иридесцентный золотой перелив. «Голографическая наклейка», вау-эффект.',x:'',b:kpi()},
    {c:'c-mill',n:'Фрезеровка',d:'Фрезерованный металл: 3D-фаска, машинная точность. Основательно.',x:'',b:kpi()}
  ];
  document.getElementById('grid').innerHTML=V.map(function(v,i){
    var nn=(i+11);
    return '<div class="dir"><span class="num">'+nn+'</span><div class="card '+v.c+'">'+v.x+v.b+'</div><div><div class="dname">'+v.n+'</div><div class="ddesc">'+v.d+'</div></div></div>';
  }).join('');
  var _s=document.createElement('script');_s.src='select.js';document.body.appendChild(_s);
</script>
</body>
</html>
