server {
    listen 80;
    server_name _;

    location = /mcp {
        proxy_pass http://mcp:8788/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8788/.well-known/oauth-protected-resource;
        proxy_set_header Host $host;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://mcp:8788/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
    }

    location = /.well-known/oauth-authorization-server/auth/v1 {
        proxy_pass http://auth:9999/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/v1/.well-known/oauth-authorization-server {
        proxy_pass http://auth:9999/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/v1/.well-known/openid-configuration {
        proxy_pass http://auth:9999/.well-known/openid-configuration;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /auth/v1/.well-known/jwks.json {
        proxy_pass http://auth:9999/.well-known/jwks.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/v1/oauth/ {
        proxy_pass http://auth:9999/oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
